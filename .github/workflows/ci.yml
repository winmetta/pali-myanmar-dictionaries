name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools with mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Check out @winmetta/myanmar-convert for Zawgyi conversion
        uses: actions/checkout@v7
        with:
          repository: winmetta/winmetta-platform
          path: .vendor-ci/winmetta-platform
          sparse-checkout: packages/myanmar-convert
      - name: Install @winmetta/myanmar-convert runtime dependencies
        run: npm install --prefix .vendor-ci/winmetta-platform/packages/myanmar-convert --omit=dev --no-audit --no-fund
      - name: Run pre-commit checks on all files
        run: lefthook run pre-commit --all-files
      - name: Build and test shared text package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:pali-text
      - name: Run unit tests
        env:
          PYTHONPATH: src
          MYANMAR_CONVERT_ENTRY: ${{ github.workspace }}/.vendor-ci/winmetta-platform/packages/myanmar-convert/src/index.ts
        run: python3 -m unittest discover -s tests -v
      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner
      - name: Check PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/conventional-commit.sh -s "$PR_TITLE"
      - name: Check PR commits follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            bash scripts/conventional-commit.sh -s "$subject"
          done
