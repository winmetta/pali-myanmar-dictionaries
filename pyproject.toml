[project]
name = "pali-myanmar-dictionaries"
version = "0.1.0"
description = "Open Unicode SQLite and JSONL Pāḷi–Myanmar dictionary datasets with source-book attribution"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 50
